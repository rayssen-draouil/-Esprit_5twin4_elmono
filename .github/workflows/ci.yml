name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel:
    name: Laravel and PHP quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_KEY: base64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
      APP_DEBUG: false
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BREVO_MAIL_DRIVER: api
      BREVO_API_KEY: ci-placeholder-not-a-real-key
      TELEGRAM_BOT_TOKEN: ''
      AI_API_KEY: ''
      GROQ_API_KEY: ''
      CHAT_AI_API_KEY: ollama
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml
          tools: composer:v2
          coverage: none
          cache: composer

      - name: Validate Composer files
        run: composer validate --no-check-publish

      - name: Install PHP dependencies from lockfile
        id: php-install
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit Composer dependencies
        run: composer audit --locked

      - name: Check PHP style with Pint
        run: vendor/bin/pint --test

      - name: Run Laravel and PHPUnit tests
        if: ${{ always() && steps.php-install.outcome == 'success' }}
        run: php artisan test

  frontend:
    name: Frontend dependencies and Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies from lockfile
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Build Vite assets
        run: npm run build

      - name: Verify Vite manifest
        run: test -s public/build/manifest.json

      - name: Upload built assets
        uses: actions/upload-artifact@v4
        with:
          name: vite-build
          path: public/build/
          if-no-files-found: error
          retention-days: 7

  flask-api:
    name: Flask classification API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: AquaSecure_AI_Classification
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: AquaSecure_AI_Classification/requirements.txt

      - name: Verify committed model exists
        run: |
          if [ ! -s model_signalement.joblib ]; then
            echo "Required model AquaSecure_AI_Classification/model_signalement.joblib is missing or empty." >&2
            exit 1
          fi

      - name: Install Flask dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile app.py predict.py train_model.py test_app.py

      - name: Run Flask API tests
        run: python -m unittest -v test_app

  docker-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Require Docker Hub credentials before publishing main
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Set the DOCKERHUB_USERNAME Actions variable and DOCKERHUB_TOKEN Actions secret to publish images from main." >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          username="$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '\r\n')"
          token="$(printf '%s' "$DOCKERHUB_TOKEN" | tr -d '\r\n')"

          if [ -z "$username" ] || [ -z "$token" ]; then
            echo "Docker Hub username or token is empty after removing line breaks." >&2
            exit 1
          fi

          case "$username" in
            *[[:space:]]*)
              echo "DOCKERHUB_USERNAME must be the Docker ID only, without spaces or a display name." >&2
              exit 1
              ;;
          esac

          if printf '%s' "$token" | grep -q '[[:space:]]'; then
            echo "DOCKERHUB_TOKEN contains whitespace; replace the GitHub secret with the raw Docker Hub token." >&2
            exit 1
          fi

          printf '%s' "$token" | docker login docker.io --username "$username" --password-stdin
          unset token

      - name: Build Laravel and Vite image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME || 'local' }}/aquasecure-web:latest
            ${{ vars.DOCKERHUB_USERNAME || 'local' }}/aquasecure-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build Flask classifier image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: AquaSecure_AI_Classification/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME || 'local' }}/aquasecure-classifier:latest
            ${{ vars.DOCKERHUB_USERNAME || 'local' }}/aquasecure-classifier:${{ github.sha }}
          cache-from: type=gha,scope=classifier
          cache-to: type=gha,scope=classifier,mode=max

  sonarqube:
    name: SonarQube analysis
    if: >-
      vars.SONAR_HOST_URL != '' &&
      !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full history for analysis
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require SonarQube token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN is required when SONAR_HOST_URL is configured." >&2
            exit 1
          fi

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
