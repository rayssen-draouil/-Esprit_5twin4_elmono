name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel:
    name: Laravel and PHP quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_KEY: base64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
      APP_DEBUG: false
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BREVO_MAIL_DRIVER: api
      BREVO_API_KEY: ci-placeholder-not-a-real-key
      TELEGRAM_BOT_TOKEN: ''
      AI_API_KEY: ''
      GROQ_API_KEY: ''
      CHAT_AI_API_KEY: ollama
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies from lockfile
        run: npm ci

      - name: Build Vite assets for Laravel feature tests
        run: npm run build

      - name: Verify Vite manifest for Laravel feature tests
        run: test -s public/build/manifest.json

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml
          tools: composer:v2
          coverage: none
          cache: composer

      - name: Validate Composer files
        run: composer validate --no-check-publish

      - name: Install PHP dependencies from lockfile
        id: php-install
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit Composer dependencies
        run: composer audit --locked

      - name: Check PHP style with Pint
        run: vendor/bin/pint --test

      - name: Run Laravel and PHPUnit tests
        if: ${{ always() && steps.php-install.outcome == 'success' }}
        continue-on-error: true
        run: php artisan test

  frontend:
    name: Frontend dependencies and Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies from lockfile
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Build Vite assets
        run: npm run build

      - name: Verify Vite manifest
        run: test -s public/build/manifest.json

      - name: Upload built assets
        uses: actions/upload-artifact@v4
        with:
          name: vite-build
          path: public/build/
          if-no-files-found: error
          retention-days: 7

  flask-api:
    name: Flask classification API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: AquaSecure_AI_Classification
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: AquaSecure_AI_Classification/requirements.txt

      - name: Verify committed model exists
        run: |
          if [ ! -s model_signalement.joblib ]; then
            echo "Required model AquaSecure_AI_Classification/model_signalement.joblib is missing or empty." >&2
            exit 1
          fi

      - name: Install Flask dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile app.py predict.py train_model.py test_app.py

      - name: Run Flask API tests
        run: python -m unittest -v test_app

  docker-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Laravel and Vite image (no publish)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: |
            ${{ vars.DOCKERHUB_USERNAME || 'local' }}/aquasecure-web:latest
            ${{ vars.DOCKERHUB_USERNAME || 'local' }}/aquasecure-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build Flask classifier image (no publish)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: AquaSecure_AI_Classification/Dockerfile
          push: false
          tags: |
            ${{ vars.DOCKERHUB_USERNAME || 'local' }}/aquasecure-classifier:latest
            ${{ vars.DOCKERHUB_USERNAME || 'local' }}/aquasecure-classifier:${{ github.sha }}
          cache-from: type=gha,scope=classifier
          cache-to: type=gha,scope=classifier,mode=max

  observability:
    name: Prometheus and Grafana stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_KEY: base64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
      GRAFANA_ADMIN_PASSWORD: ci-only-not-a-secret
      AQUASECURE_HTTP_PORT: '18080'
      PROMETHEUS_PORT: '19091'
      GRAFANA_PORT: '13001'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate observability Compose configuration
        run: docker compose --profile observability config --quiet

      - name: Start application and observability stack
        run: docker compose --profile observability up --build --detach --wait --wait-timeout 300

      - name: Check Prometheus and Grafana health endpoints
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 30 --retry-delay 3 --retry-all-errors \
            http://127.0.0.1:${PROMETHEUS_PORT}/-/ready
          curl --fail --silent --show-error --retry 30 --retry-delay 3 --retry-all-errors \
            http://127.0.0.1:${GRAFANA_PORT}/api/health

      - name: Stop observability stack
        if: ${{ always() }}
        run: docker compose --profile observability down --volumes --remove-orphans

  sonarqube:
    name: SonarQube analysis
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    env:
      SONAR_HOST_URL: http://localhost:8888
    steps:
      - name: Check out full history for analysis
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require SonarQube token
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            throw 'SONAR_TOKEN is required when SONAR_HOST_URL is configured.'
          }

      - name: Add GPG tools required to verify SonarScanner
        shell: powershell
        run: |
          $gpgDirectory = Join-Path $env:ProgramFiles 'Git\usr\bin'
          foreach ($tool in @('gpg.exe', 'dirmngr.exe')) {
            if (-not (Test-Path (Join-Path $gpgDirectory $tool))) {
              throw "Required SonarScanner signature tool is missing: $tool"
            }
          }
          $gpgDirectory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
